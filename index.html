<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Places · 回忆地图相册</title>
<link rel="stylesheet" href="https://fastly.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root{
    --bg:#fbeef0; --ink:#4a3540; --soft:#9a7f88;
    --line:#ecd3d8; --accent:#c9768a; --accent-deep:#8a3f55;
    --card:#fffafb; --hl-fill:#f6c6cf; --hl-line:#d98a9b;
    --prov-fill:#fde0e5; --prov-line:#e9b3bd;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    background:var(--bg);color:var(--ink);
    font-family:"Noto Sans SC",system-ui,-apple-system,sans-serif;overflow:hidden;
  }

  /* 纯矢量底图：粉米白渐变背景，不加载在线瓦片 */
  #map{
    position:absolute;inset:0;z-index:1;
    background:linear-gradient(180deg,#fdeef0 0%,#fbe7ea 100%);
    transition:all .8s cubic-bezier(.22,.8,.3,1);
  }
  body.mode-photo #map{width:50%;opacity:.4;}
  @media(max-width:820px){ body.mode-photo #map{width:100%;height:42%;} }

  .map-title{position:absolute;top:28px;left:36px;z-index:500;pointer-events:none;}
  .map-title .brand{font-size:13px;letter-spacing:.35em;color:var(--ink);}
  .map-title .sub{font-size:12px;letter-spacing:.2em;color:var(--soft);margin-top:6px;}

  /* 爱心标记 */
  .pin{
    background:var(--accent);border:3px solid #fff;border-radius:50%;
    width:24px;height:24px;box-shadow:0 5px 16px rgba(150,70,90,.4);
    cursor:pointer;transition:transform .2s ease,background .2s ease;
  }
  .pin::after{
    content:"♡";position:absolute;inset:0;display:flex;align-items:center;
    justify-content:center;font-size:14px;color:#fff;
  }
  .pin.hover{background:var(--accent-deep);transform:scale(1.25);}

  .panel{
    position:absolute;top:0;right:0;height:100%;width:50%;z-index:10;
    background:var(--card);border-left:1px solid var(--line);
    transform:translateX(100%);opacity:0;
    transition:transform .8s cubic-bezier(.22,.8,.3,1),opacity .8s ease;
    display:flex;flex-direction:column;
  }
  body.mode-photo .panel{transform:translateX(0);opacity:1;}
  @media(max-width:820px){ .panel{width:100%;height:58%;top:42%;} }

  .panel-head{padding:28px 32px 20px;border-bottom:1px solid var(--line);}
  .back-btn{background:none;border:none;cursor:pointer;color:var(--soft);font-size:13px;letter-spacing:.15em;font-family:inherit;margin-bottom:14px;}
  .back-btn:hover{color:var(--ink);}
  .panel-head .kicker{font-size:12px;letter-spacing:.3em;color:var(--accent);margin-bottom:10px;}
  .panel-head h2{font-size:24px;font-weight:600;line-height:1.4;}
  .panel-head .date{font-size:13px;color:var(--soft);margin-top:8px;}
  .panel-head .desc{font-size:14px;color:var(--soft);line-height:1.8;margin-top:12px;font-weight:300;}

  .gallery{flex:1;overflow-y:auto;padding:24px 32px 40px;column-count:2;column-gap:16px;}
  @media(max-width:480px){.gallery{column-count:1;}}
  .gallery-item{break-inside:avoid;margin-bottom:16px;border-radius:8px;overflow:hidden;background:#fbeef0;animation:fadeUp .6s ease both;}
  .gallery-item img{width:100%;display:block;}
  @keyframes fadeUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
  .gallery::-webkit-scrollbar{width:6px;}
  .gallery::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px;}
</style>
</head>
<body>

  <div id="map"></div>

  <div class="map-title">
    <div class="brand">OUR PLACES</div>
    <div class="sub">点开一颗心，看看那里的回忆</div>
  </div>

  <aside class="panel" id="panel">
    <header class="panel-head">
      <button class="back-btn" id="backBtn">← 返回地图</button>
      <div class="kicker" id="pKicker"></div>
      <h2 id="pTitle"></h2>
      <div class="date" id="pDate"></div>
      <p class="desc" id="pDesc"></p>
    </header>
    <div class="gallery" id="gallery"></div>
  </aside>

<script src="https://fastly.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
/* ============================================================
   adcode: 行政区划代码（拉真实边界，无需 key）
   range : 边界加载失败时的兜底圆圈半径（米）
   ============================================================ */
const places = [
  { name:"合肥",     date:"2026.05", lat:31.8206, lng:117.2272, adcode:"340100", range:28000,
    desc:"五月在安徽合肥的一段回忆。",
    photos:["images/place1/1.jpg","images/place1/2.jpg","images/place1/3.jpg"] },
  { name:"川西 · 甘孜", date:"2026.07", lat:30.0515, lng:101.9628, adcode:"513300", range:60000,
    desc:"七月出发，先到川西甘孜，高原的风和景色。",
    photos:["images/place2/1.jpg","images/place2/2.jpg","images/place2/3.jpg"] },
  { name:"成都",     date:"2026.07", lat:30.5728, lng:104.0668, adcode:"510100", range:32000,
    desc:"从川西下来，途经成都。",
    photos:["images/place3/1.jpg","images/place3/2.jpg","images/place3/3.jpg"] },
  { name:"西安",     date:"2026.07", lat:34.3416, lng:108.9398, adcode:"610100", range:32000,
    desc:"一路向北，来到西安。",
    photos:["images/place4/1.jpg","images/place4/2.jpg","images/place4/3.jpg"] },
  { name:"徐州",     date:"2026.07", lat:34.2058, lng:117.2839, adcode:"320300", range:26000,
    desc:"途经徐州。",
    photos:["images/place5/1.jpg","images/place5/2.jpg","images/place5/3.jpg"] },
  { name:"扬州",     date:"2026.07", lat:32.3942, lng:119.4127, adcode:"321000", range:22000,
    desc:"下一站，扬州。",
    photos:["images/place6/1.jpg","images/place6/2.jpg","images/place6/3.jpg"] },
  { name:"南京",     date:"2026.07", lat:32.0603, lng:118.7969, adcode:"320100", range:28000,
    desc:"这趟旅程的最后一站，南京。",
    photos:["images/place7/1.jpg","images/place7/2.jpg","images/place7/3.jpg"] }
];

const HOME = { center:[32.5,113.0], zoom:5 };
const GEO = "https://geo.datav.aliyun.com/areas_v3/bound";

const map = L.map('map',{zoomControl:true, attributionControl:false})
  .setView(HOME.center, HOME.zoom);

/* 图层：省面 / 悬停预览 / 点击选中 */
let provinceLayer = null, hoverLayer = null, highlightLayer = null;
const geoCache = {};
let current = -1;
let hoverToken = 0;

/* ---------- 加载省面（扁平卡通底图，无路网无地名） ---------- */
async function loadProvince(){
  try{
    const res = await fetch(`${GEO}/100000.json`);
    const data = await res.json();
    provinceLayer = L.geoJSON(data,{
      style:{
        fillColor:'#fde0e5', fillOpacity:.7,
        color:'#e9b3bd', weight:1.2
      }
    }).addTo(map);
  }catch(e){ console.warn('省面加载失败', e); }
}
loadProvince();

/* ---------- 边界数据缓存 ---------- */
async function getGeo(adcode){
  if(geoCache[adcode]) return geoCache[adcode];
  const res = await fetch(`${GEO}/${adcode}.json`);
  const data = await res.json();
  geoCache[adcode] = data;
  return data;
}

const hoverStyle = { color:'#8a3f55', weight:2, fillColor:'#f6c6cf', fillOpacity:.5 };
const activeStyle= { color:'#8a3f55', weight:2.5, fillColor:'#f6c6cf', fillOpacity:.45 };

function removeLayer(layer){ if(layer){ map.removeLayer(layer); layer=null; } }

/* 悬停预览轮廓 */
async function previewPlace(i){
  if(current===i) return;
  const p = places[i];
  const token = ++hoverToken;
  try{
    const data = await getGeo(p.adcode);
    if(token!==hoverToken) return;           // 防止快速划过串层
    removeLayer(hoverLayer);
    hoverLayer = L.geoJSON(data,{style:hoverStyle}).addTo(map);
  }catch(e){
    removeLayer(hoverLayer);
    hoverLayer = L.circle([p.lat,p.lng],{radius:p.range,...hoverStyle,dashArray:'4 4'}).addTo(map);
  }
}
function clearPreview(){
  hoverToken++;
  removeLayer(hoverLayer);
}

/* 点击选中高亮 */
async function highlightPlace(i){
  const p = places[i];
  removeLayer(highlightLayer);
  try{
    const data = await getGeo(p.adcode);
    highlightLayer = L.geoJSON(data,{style:activeStyle}).addTo(map);
  }catch(e){
    highlightLayer = L.circle([p.lat,p.lng],{
      radius:p.range, color:'#8a3f55', weight:2.5,
      fillColor:'#f6c6cf', fillOpacity:.45, dashArray:'4 4'
    }).addTo(map);
  }
}

const pinIcon = L.divIcon({className:'',html:'<div class="pin"></div>',iconSize:[24,24],iconAnchor:[12,12]});

places.forEach((p,i)=>{
  const marker = L.marker([p.lat,p.lng],{icon:pinIcon}).addTo(map);
  marker.bindTooltip(p.name,{direction:'top',offset:[0,-12]});

  marker.on('mouseover',()=>{
    const el=marker.getElement(); if(el) el.classList.add('hover');
    previewPlace(i);
  });
  marker.on('mouseout',()=>{
    const el=marker.getElement(); if(el) el.classList.remove('hover');
    if(current!==i) clearPreview();
  });
  marker.on('click',()=>openPlace(i));
});

const gallery = document.getElementById('gallery');

async function openPlace(i){
  const p = places[i];
  current = i;
  clearPreview();
  document.body.classList.add('mode-photo');
  map.flyTo([p.lat,p.lng], 9, {duration:1.2});
  await highlightPlace(i);

  document.getElementById('pKicker').textContent = "PLACE 0" + (i+1);
  document.getElementById('pTitle').textContent = p.name;
  document.getElementById('pDate').textContent = p.date;
  document.getElementById('pDesc').textContent = p.desc;

  gallery.innerHTML = "";
  p.photos.forEach((src,idx)=>{
    const item = document.createElement('div');
    item.className = 'gallery-item';
    item.style.animationDelay = (idx*0.08)+'s';
    const img = document.createElement('img');
    img.src = src; img.alt = p.name;
    img.onerror = ()=>{item.style.display='none';};
    item.appendChild(img);
    gallery.appendChild(item);
  });
  gallery.scrollTop = 0;
}

document.getElementById('backBtn').onclick = ()=>{
  current = -1;
  document.body.classList.remove('mode-photo');
  removeLayer(highlightLayer);
  clearPreview();
  map.flyTo(HOME.center, HOME.zoom,{duration:1});
};

window.addEventListener('resize',()=>map.invalidateSize());
</script>
</body>
</html>
