<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>地图测试</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
#map{width:100%;height:100%;background:#fff}
.heart-icon{font-size:28px;color:#ff7b9c}
</style>
</head>
<body>
<div id="map"></div>

<script>
const map = L.map('map',{zoomControl:false}).setView([32,110],4.2);

L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{
  maxZoom:12
}).addTo(map);

const sites = [
  {name:"安徽合肥",lat:31.86,lng:117.28},
  {name:"成都",lat:30.67,lng:104.07},
  {name:"西安",lat:34.27,lng:108.95},
  {name:"南京",lat:32.06,lng:118.78}
];

sites.forEach(site=>{
  const icon = L.divIcon({
    className:'heart-marker',
    html:`<div class="heart-icon">♥</div>`,
    iconSize:[32,32],
    iconAnchor:[16,16]
  });

  L.marker([site.lat,site.lng],{icon}).addTo(map);
});
</script>
</body>
</html>
