<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我们的旅行回忆</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,sans-serif}
body{overflow:hidden;height:100vh}
#map{position:absolute;left:0;top:0;width:100%;height:100%;z-index:1}
/* 相册侧边面板 */
#panel{position:absolute;right:-420px;top:0;width:400px;height:100vh;background:#fff8fb;z-index:2;transition:right 0.7s ease;overflow-y:auto;padding:24px}
#panel.active{right:0}
.panel-title{font-size:22px;font-weight:600;color:#c86b85;margin-bottom:12px}
.panel-date{color:#888;font-size:14px;margin-bottom:20px;border-bottom:1px solid #f2d7df;padding-bottom:12px}
.waterfall{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.waterfall img{width:100%;border-radius:10px;object-fit:cover;background:#eee}
.back-btn{margin-top:20px;padding:9px 16px;border:none;background:#e88ea4;color:white;border-radius:8px;cursor:pointer}
/* 爱心marker样式 */
.heart-icon{font-size:28px;transition:transform 0.2s,color 0.2s;color:#ff7b9c}
.heart-icon:hover{transform:scale(1.25);color:#d6486b}
/* 加载提示 */
#loading{position:absolute;inset:0;background:rgba(255,255,255,0.7);z-index:10;display:flex;align-items:center;justify-content:center;color:#c86b85;font-size:18px}
</style>
</head>
<body>
<div id="loading">加载中...</div>
<div id="map"></div>
<div id="panel">
  <h2 class="panel-title" id="siteName"></h2>
  <div class="panel-date" id="siteDate"></div>
  <div class="waterfall" id="photoList"></div>
  <button class="back-btn" onclick="closePanel()">返回地图</button>
</div>

<script>
// ==========【在这里填入你的supabase信息】==========
const SUPABASE_URL = "https://vwxiepjgpgrallligab.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_mDgxnr8vboC3gmSyuCmyUw_eU0S9W-R";
// =================================================

const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// 地点数据
const sites = [
  {name:"安徽合肥",date:"2026年5月",lat:31.86,lng:117.28,region:"合肥市"},
  {name:"川西（甘孜）",date:"2026年7月",lat:30.05,lng:100.32,region:"甘孜州"},
  {name:"成都",date:"2026年7月",lat:30.67,lng:104.07,region:"成都市"},
  {name:"西安",date:"2026年7月",lat:34.27,lng:108.95,region:"西安市"},
  {name:"徐州",date:"2026年7月",lat:34.22,lng:117.20,region:"徐州市"},
  {name:"扬州",date:"2026年7月",lat:32.39,lng:119.42,region:"扬州市"},
  {name:"南京",date:"2026年7月",lat:32.06,lng:118.78,region:"南京市"},
];

// 卡通浅色底图（简洁OSM，路网弱化）
const map = L.map('map',{zoomControl:false}).setView([32,110],4.2);
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{
  attribution:'&copy; CartoDB',
  maxZoom:12
}).addTo(map);

// 行政区高亮图层容器
let highlightLayer = L.geoJSON(null,{
  style(){return {fillColor:'#ffd6e0',fillOpacity:0.45,color:'#f2a2b8',weight:1}}
}).addTo(map);

// 爱心标记
const markers = [];
sites.forEach(site=>{
  const iconDiv = L.divIcon({
    className:'heart-marker',
    html:`<div class="heart-icon">♥</div>`,
    iconSize:[32,32],iconAnchor:[16,16]
  })
  const m = L.marker([site.lat,site.lng],{icon:iconDiv}).addTo(map);
  m.on('click',()=>openSite(site));
  markers.push(m);
})

// 打开点位，地图平移+高亮+相册滑入
async function openSite(site){
  document.getElementById('loading').style.display='flex';
  // 地图移动到左侧视野
  map.flyTo([site.lat,site.lng],7,{duration:0.7});
  // 清空旧高亮
  highlightLayer.clearLayers();
  // 尝试加载行政区边界（网络不稳就自动降级，不卡死页面）
  try{
    const res = await fetch(`https://geo.datav.aliyun.com/areas_v3/bound/${site.region}_full.json`)
    if(res.ok){
      const geo = await res.json();
      highlightLayer.addData(geo);
    }
  }catch(e){console.log('边界加载失败，跳过行政区高亮')}

  // 读取supabase里面这个地点的照片
  const {data} = await supabase.from('photos').select('url').eq('site_name',site.name);
  renderPhotos(site,data||[]);
  document.getElementById('panel').classList.add('active');
  document.getElementById('loading').style.display='none';
}

function renderPhotos(site,photoArr){
  document.getElementById('siteName').innerText = site.name;
  document.getElementById('siteDate').innerText = site.date;
  const wrap = document.getElementById('photoList');
  wrap.innerHTML = '';
  if(photoArr.length===0){
    wrap.innerHTML = '<p style="grid-column:1/-1;color:#999">暂未上传照片，可以去supabase storage上传</p>'
    return;
  }
  photoArr.forEach(p=>{
    const img = document.createElement('img');
    img.src = p.url;
    img.loading="lazy";
    wrap.appendChild(img);
  })
}
function closePanel(){
  document.getElementById('panel').classList.remove('active');
  highlightLayer.clearLayers();
}
window.onload = ()=>{
  document.getElementById('loading').style.display='none';
}
</script>
</body>
</html>
